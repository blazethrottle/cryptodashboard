name: Snapshot + Deploy to Pages

# 30분마다 자동 실행 + 코드 변경 시 + 수동 트리거
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "web/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/snapshot-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci

      - name: Run snapshot (X-VIP universe)
        run: npm run snapshot -- --universe=xvip --concurrency=4

      - name: Run institutions analysis
        run: npm run institutions

      - name: Copy snapshot to web/public/data
        run: |
          mkdir -p web/public/data
          LATEST=$(ls -t data/snapshots/*.json | head -1)
          cp "$LATEST" web/public/data/snapshot.json
          echo "Copied: $LATEST → web/public/data/snapshot.json"
          ls -la web/public/data/

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web
        working-directory: ./web
        env:
          GITHUB_ACTIONS: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

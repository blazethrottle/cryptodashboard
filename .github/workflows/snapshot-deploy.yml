name: Snapshot + Deploy to Pages

# 매시간 자동 실행 + 코드 변경 시 + 수동 트리거
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "web/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/snapshot-deploy.yml"

permissions:
  contents: write   # data/timeseries.json auto-commit 위해 write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci

      - name: Run snapshot (X-VIP universe)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run snapshot -- --universe=xvip --concurrency=4

      - name: Run institutions analysis
        run: npm run institutions

      - name: Copy snapshot to web/public/data
        run: |
          mkdir -p web/public/data
          LATEST=$(ls -t data/snapshots/*.json | head -1)
          cp "$LATEST" web/public/data/snapshot.json
          echo "Copied: $LATEST → web/public/data/snapshot.json"
          ls -la web/public/data/

      - name: Commit timeseries.json (누적 데이터 보존)
        run: |
          if [ -f data/timeseries.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/timeseries.json
            if ! git diff --cached --quiet; then
              git commit -m "data: timeseries snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
              git push origin dev
            else
              echo "timeseries.json 변경 없음 — commit skip"
            fi
          fi

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web
        working-directory: ./web
        env:
          GITHUB_ACTIONS: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry (transient Pages failure)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
